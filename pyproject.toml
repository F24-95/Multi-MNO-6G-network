[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dss"
version = "0.1.0"
description = "AI-Based Dynamic Spectrum Sharing for Multi-MNO 6G Networks"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
