vae_gmm:
  input_dim: 4
  encoder_dims: [32, 16]
  latent_dim: 2
  decoder_dims: [16, 32]
  activation: "relu"
  lr: 0.001
  batch_size: 512
  max_epochs: 100
  patience: 10
  kl_warmup_epochs: 10
  beta: 1.0
  gmm_components: 2
  covariance_type: "full"
  n_init: 5

autoencoder:
  input_dim: 64
  encoder_dims: [32, 16, 8]
  latent_dim: 8
  decoder_dims: [16, 32, 64]
  activation: "relu"
  output_activation: "sigmoid"
  corruption_noise_std: 0.05
  lr: 0.001
  batch_size: 256
  max_epochs: 100
  patience: 10

gan:
  latent_dim: 64
  window_flat_dim: 252 # 12*20 features + 3*4 targets
  generator_dims: [128, 256]
  discriminator_dims: [256, 128]
  dropout: 0.3
  lr: 0.0002
  beta1: 0.5
  batch_size: 128
  max_epochs: 500
  label_smoothing: 0.9
  synth_ratio: 1.0
  validation:
    max_ks: 0.15
    min_ks_pass_ratio: 0.90
    max_corr_diff: 0.15
    max_rejection_rate: 0.50

forecaster:
  input_dim: 20
  seq_len: 12
  horizon: 3
  n_mno: 4
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  lr: 0.001
  batch_size: 128
  max_epochs: 100
  patience: 10
  gradient_clip: 1.0
